name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: python3 tests/identity.py
      - run: cargo test --workspace

  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: >-
          sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
          libxkbcommon-x11-0 libxcursor1 libxrandr2 libxi6 libgl1-mesa-dri libegl1 xvfb imagemagick
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo locale-gen en_US.UTF-8
      - run: bash tests/screenshots.sh screenshots
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: screenshots/

  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: release
      - run: cargo build --release -p calendio -p calendio-booker
      - uses: actions/upload-artifact@v4
        with:
          name: calendio-linux-x86_64
          path: |
            target/release/calendio
            target/release/calendio-booker
