[package]
name = "calendio-booker"
description = "Calendio's booking daemon: the public booking page and its JSON API"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
calendio-core = { path = "../core" }
axum = "0.8"
chrono.workspace = true
chrono-tz.workspace = true
iana-time-zone = "0.1"
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1", features = ["rt", "macros", "net", "signal", "time", "process", "io-util"] }

reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
url = "2.5.8"
sha2 = "0.10.9"
base64 = "0.22.1"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
