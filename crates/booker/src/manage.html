<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Manage your booking · Calendio</title><style>
:root{color-scheme:light;--bg:#fafbf9;--surface:#fff;--ink:#202c32;--muted:#42535d;--line:#d6ddda;--accent:#2457b2;--danger:#a72e49}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}main{max-width:620px;margin:8vh auto;padding:28px}header{border-bottom:1px solid var(--line);padding-bottom:20px}small{color:var(--muted)}h1{font-size:30px;line-height:1.2}h2{font-size:19px;margin-top:28px}button,input,select{font:inherit;border:1px solid var(--line);border-radius:6px;padding:10px 14px;background:var(--surface);color:var(--ink)}button{cursor:pointer;touch-action:manipulation}button:hover{border-color:var(--accent)}button:disabled{opacity:.55;cursor:wait}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.primary{background:var(--accent);color:white}.danger{color:var(--danger)}label{display:grid;gap:6px;margin:16px 0}#slots{display:flex;flex-wrap:wrap;gap:8px;margin:18px 0}#status{white-space:pre-wrap}#error{color:var(--danger)}[hidden]{display:none!important}@media(max-width:600px){main{margin:20px auto;padding:20px}input,select{max-width:100%}}</style></head><body><main><header><small>CALENDIO</small><h1>Change your booking</h1><p id="summary">Loading booking…</p></header><p id="status" role="status" aria-live="polite"></p><p id="error" role="alert" hidden></p><section id="controls" hidden><h2>Pick a new time</h2><label>Timezone<select id="zone"></select></label><label>Date<input id="day" type="date"></label><div id="slots" aria-label="Available times"></div><button id="move" class="primary" disabled>Confirm new time</button><h2>Cancel booking</h2><p>Your original time stays reserved until a change succeeds.</p><button id="cancel" class="danger">Cancel this booking</button></section></main><script>
'use strict';const $=id=>document.getElementById(id),token=location.pathname.split('/').pop(),base='/api/manage/'+encodeURIComponent(token);let booking,chosen=null,busy=false,requestId=0;const fmt=at=>new Intl.DateTimeFormat(undefined,{dateStyle:'full',timeStyle:'short',timeZone:$('zone').value}).format(new Date(at));const dayKey=at=>{const parts=new Intl.DateTimeFormat('en',{timeZone:$('zone').value,year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date(at));const val=t=>parts.find(p=>p.type===t).value;return `${val('year')}-${val('month')}-${val('day')}`};
async function api(path,body){const response=await fetch(path,body?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'}:{cache:'no-store'});const data=await response.json();if(!response.ok)throw Error(data.error||'Booking request failed');return data;}function error(e){$('error').textContent=e.message;$('error').hidden=false;}function render(){const active=booking.status==='confirmed'&&new Date(booking.start)>new Date();$('summary').textContent=booking.type_title+' · '+fmt(booking.start);$('controls').hidden=!active;$('status').textContent=booking.status==='cancelled'?'This booking is cancelled.':active?'Your booking is confirmed.':'This booking has already started and can no longer be changed.';}
async function slots(){const current=++requestId;chosen=null;$('move').disabled=true;$('slots').replaceChildren();if(!booking||booking.status!=='confirmed'||!$('day').value)return;const day=new Date($('day').value+'T00:00:00Z');if(Number.isNaN(day.getTime()))return;const query=new URLSearchParams({from:new Date(day.getTime()-86400000).toISOString(),to:new Date(day.getTime()+172800000).toISOString(),tz:$('zone').value});try{const data=await api(base+'/slots?'+query);if(current!==requestId)return;const list=data.slots.filter(at=>dayKey(at)===$('day').value);for(const at of list){const b=document.createElement('button');b.type='button';b.textContent=new Intl.DateTimeFormat(undefined,{hour:'2-digit',minute:'2-digit',timeZone:$('zone').value}).format(new Date(at));b.onclick=()=>{chosen=at;$('move').disabled=false;for(const child of $('slots').children)child.setAttribute('aria-pressed','false');b.setAttribute('aria-pressed','true');};$('slots').append(b);}if(!list.length)$('slots').textContent='No open times on this date.';}catch(e){if(current===requestId)error(e);}}
$('zone').onchange=()=>{render();slots();};$('day').onchange=slots;$('move').onclick=async()=>{if(busy||!chosen)return;busy=true;$('move').disabled=true;$('cancel').disabled=true;$('error').hidden=true;try{booking=await api(base+'/reschedule',{start:chosen,tz:$('zone').value});render();$('status').textContent='Your new time is confirmed.';await slots();}catch(e){error(e);}finally{busy=false;$('cancel').disabled=false;$('move').disabled=!chosen;}};$('cancel').onclick=async()=>{if(busy||!confirm('Cancel this booking and release its time?'))return;busy=true;$('cancel').disabled=true;$('move').disabled=true;try{booking=await api(base+'/cancel',{});render();}catch(e){error(e);$('cancel').disabled=false;}finally{busy=false;}};
(async()=>{try{booking=await api(base);const zones=typeof Intl.supportedValuesOf==='function'?Intl.supportedValuesOf('timeZone'):['UTC',Intl.DateTimeFormat().resolvedOptions().timeZone];if(!zones.includes(booking.guest_tz))zones.push(booking.guest_tz);for(const zone of zones){const option=document.createElement('option');option.value=zone;option.textContent=zone;option.selected=zone===booking.guest_tz;$('zone').append(option);}$('day').value=dayKey(booking.start);render();if(!$('controls').hidden)await slots();}catch(e){$('summary').textContent='Booking unavailable';error(e);}})();
</script></body></html>
